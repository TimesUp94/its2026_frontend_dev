appId: it.its.minicommerce
productName: MiniCommerce
copyright: ITS Frontend Development

directories:
  output: release
  buildResources: build

# Nel pacchetto finisce solo il guscio compilato...
files:
  - dist/**/*
  - package.json

# ...il renderer e le icone arrivano come risorse esterne
extraResources:
  - from: ../frontend/dist
    to: renderer
  - from: build/tray.png
    to: tray.png
  - from: build/icon.png
    to: icon.png

win:
  target: nsis
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png

mac:
  target: dmg
  category: public.app-category.business
  icon: build/icon.png
